<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bugünkü Maçlar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f6f9;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }
    #matches {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      min-height: 100px;
    }
    #last-update {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>📺 Bugünkü Maçlar</h1>
  <div id="matches">Yükleniyor...</div>
  <div id="last-update"></div>

  <script>
    async function loadMatches() {
      try {
        let response = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent("https://www.tvyayinakisi.com/bugunku-maclar/"));
        let text = await response.text();

        let parser = new DOMParser();
        let doc = parser.parseFromString(text, "text/html");

        let element = doc.querySelector(".detail-days.no-padding-top");

        if (element) {
          document.getElementById("matches").innerHTML = element.outerHTML;
          document.getElementById("last-update").innerText =
            "Son güncelleme: " + new Date().toLocaleTimeString("tr-TR");
        } else {
          document.getElementById("matches").innerText = "İçerik bulunamadı.";
        }
      } catch (e) {
        document.getElementById("matches").innerText = "Veri alınamadı (CORS veya bağlantı hatası).";
      }
    }

    // İlk yükleme
    loadMatches();
    // Her 5 dakikada bir güncelle
    setInterval(loadMatches, 5 * 60 * 1000);
  </script>
</body>
</html>
